<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setl BPMN</title>
  <link rel="stylesheet" href="./dist/assets/diagram-js.css" />
  <link rel="stylesheet" href="./dist/assets/bpmn-js.css" />
  <link rel="stylesheet" href="./dist/assets/bpmn-font/css/bpmn.css" />
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f3f5f7;
      --panel-bg: rgba(255, 255, 255, 0.92);
      --panel-border: rgba(15, 23, 42, 0.08);
      --text-main: #111827;
      --text-muted: #6b7280;
      --accent: #ed1c24;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(237, 28, 36, 0.10), transparent 28%),
        linear-gradient(180deg, #f8fafc 0%, var(--page-bg) 100%);
      color: var(--text-main);
    }

    .app-shell {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
      padding: 18px;
      gap: 16px;
    }

    .app-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      padding: 18px 22px;
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }

    .app-brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .app-title {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .app-subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    .app-logo {
      width: 148px;
      max-width: 28vw;
      height: auto;
      flex: 0 0 auto;
    }

    .canvas-shell {
      min-height: 0;
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: var(--shadow);
    }

    #canvas {
      width: 100%;
      height: 100%;
    }

    .djs-container,
    .djs-palette {
      background: transparent;
    }

    .bjs-powered-by {
      display: none;
    }

    .status {
      position: absolute;
      left: 34px;
      bottom: 118px;
      z-index: 10;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.88);
      color: #fff;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .status.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toolbar {
      position: absolute;
      left: 34px;
      bottom: 30px;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      max-width: min(420px, calc(100vw - 68px));
      padding: 12px;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .toolbar-button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
    }

    .toolbar-button.secondary {
      border-color: #d0d7de;
      background: #fff;
      color: var(--text-main);
    }

    .toolbar-button:hover {
      filter: brightness(0.98);
    }

    .toolbar-status {
      flex-basis: 100%;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.3;
      word-break: break-word;
    }

    @media (max-width: 720px) {
      .app-shell {
        padding: 12px;
      }

      .app-header {
        padding: 16px;
        border-radius: 16px;
      }

      .app-title {
        font-size: 22px;
      }

      .app-logo {
        width: 110px;
      }

      .canvas-shell {
        border-radius: 18px;
      }

      .toolbar {
        left: 24px;
        right: 24px;
        bottom: 24px;
        max-width: none;
      }

      .status {
        left: 24px;
        bottom: 132px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-brand">
        <h1 class="app-title">Setl BPMN</h1>
        <p class="app-subtitle">Редактор BPMN загружается сразу на главной странице</p>
      </div>
      <img class="app-logo" src="./assets/setl_logo.svg" alt="Setl logo" />
    </header>

    <main class="canvas-shell">
      <div id="canvas"></div>
    </main>

    <div class="toolbar">
      <button id="open-button" class="toolbar-button secondary" type="button">Загрузить BPMN</button>
      <button id="save-button" class="toolbar-button" type="button">Выгрузить BPMN</button>
      <input id="file-input" type="file" accept=".bpmn,.xml,text/xml,application/xml" hidden />
      <div id="file-name" class="toolbar-status">diagram.bpmn</div>
    </div>

    <div id="status" class="status" aria-live="polite"></div>
  </div>

  <script src="./dist/bpmn-modeler.development.js"></script>
  <script>
    const initialDiagram = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" targetNamespace="http://bpmn.io/schema/bpmn" id="Definitions_1">
  <bpmn:process id="Process_1" isExecutable="false">
    <bpmn:startEvent id="StartEvent_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="BPMNDiagram_1">
    <bpmndi:BPMNPlane id="BPMNPlane_1" bpmnElement="Process_1">
      <bpmndi:BPMNShape id="_BPMNShape_StartEvent_2" bpmnElement="StartEvent_1">
        <dc:Bounds height="36.0" width="36.0" x="173.0" y="102.0"/>
      </bpmndi:BPMNShape>
    </bpmndi:BPMNPlane>
  </bpmndi:BPMNDiagram>
</bpmn:definitions>`;

    const canvas = document.getElementById('canvas');
    const openButton = document.getElementById('open-button');
    const saveButton = document.getElementById('save-button');
    const fileInput = document.getElementById('file-input');
    const fileNameNode = document.getElementById('file-name');
    const statusNode = document.getElementById('status');

    const modeler = new BpmnJS({
      container: canvas
    });

    let currentFileName = 'diagram.bpmn';
    let statusTimer;

    function showStatus(message) {
      statusNode.textContent = message;
      statusNode.classList.add('is-visible');

      window.clearTimeout(statusTimer);
      statusTimer = window.setTimeout(() => {
        statusNode.classList.remove('is-visible');
      }, 2200);
    }

    async function openDiagram() {
      try {
        await modeler.importXML(initialDiagram);
        const canvasApi = modeler.get('canvas');
        canvasApi.zoom('fit-viewport');
        fileNameNode.textContent = currentFileName;
        showStatus('Редактор готов к работе');
      } catch (error) {
        console.error('Failed to load BPMN diagram', error);
        showStatus('Не удалось загрузить стартовую диаграмму');
      }
    }

    function downloadFile(fileName, content, type) {
      const blob = new Blob([ content ], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();

      window.setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 0);
    }

    openButton.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = async (loadEvent) => {
        try {
          const xml = loadEvent.target.result;
          await modeler.importXML(xml);
          modeler.get('canvas').zoom('fit-viewport');
          currentFileName = file.name || 'diagram.bpmn';
          fileNameNode.textContent = currentFileName;
          showStatus('Диаграмма загружена');
        } catch (error) {
          console.error('Failed to import BPMN diagram', error);
          showStatus('Ошибка загрузки BPMN');
        }
      };

      reader.readAsText(file);
      fileInput.value = '';
    });

    saveButton.addEventListener('click', async () => {
      try {
        const result = await modeler.saveXML({ format: true });
        downloadFile(currentFileName, result.xml, 'application/xml;charset=utf-8');
        fileNameNode.textContent = currentFileName;
        showStatus('BPMN выгружен');
      } catch (error) {
        console.error('Failed to export BPMN diagram', error);
        showStatus('Ошибка выгрузки BPMN');
      }
    });

    openDiagram();

    window.addEventListener('resize', () => {
      const canvasApi = modeler.get('canvas');
      canvasApi.resized();
      canvasApi.zoom('fit-viewport');
    });
  </script>
</body>
</html>
