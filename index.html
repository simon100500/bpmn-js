<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setl BPMN</title>
  <link rel="stylesheet" href="./dist/assets/diagram-js.css" />
  <link rel="stylesheet" href="./dist/assets/bpmn-js.css" />
  <link rel="stylesheet" href="./dist/assets/bpmn-font/css/bpmn.css" />
  <style>
    :root {
      color-scheme: light;
      --text-main: #111827;
      --text-muted: #6b7280;
      --accent: #ed1c24;
      --panel-border: rgba(15, 23, 42, 0.08);
      --shadow: 0 10px 30px rgba(31, 35, 40, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #ffffff;
      color: var(--text-main);
    }

    .app-shell {
      position: relative;
      height: 100%;
    }

    .app-logo {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 20;
      width: 88px;
      height: auto;
    }

    .canvas-shell {
      width: 100%;
      height: 100%;
    }

    #canvas {
      width: 100%;
      height: 100%;
    }

    .djs-container {
      background: #ffffff;
    }

    .djs-palette {
      background: #f5f7fa;
      z-index: 30;
    }

    .djs-palette.open,
    .djs-context-pad,
    .djs-popup,
    .djs-search-container {
      z-index: 31;
    }

    .djs-palette .entry,
    .djs-context-pad .entry {
      opacity: 1;
    }

    .djs-palette.two-column.open {
      width: auto;
    }

    .bjs-powered-by {
      display: none;
    }

    .status {
      position: absolute;
      left: 34px;
      bottom: 118px;
      z-index: 10;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.88);
      color: #fff;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .status.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toolbar {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      max-width: min(420px, calc(100vw - 32px));
      padding: 12px;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .toolbar-button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
    }

    .toolbar-button.secondary {
      border-color: #d0d7de;
      background: #fff;
      color: var(--text-main);
    }

    .toolbar-button:hover {
      filter: brightness(0.98);
    }

    .toolbar-status {
      flex-basis: 100%;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.3;
      word-break: break-word;
    }

    .toolbar-setting {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      font-size: 13px;
      white-space: nowrap;
    }

    .toolbar-setting input {
      width: 72px;
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      background: #fff;
      color: inherit;
      font: inherit;
    }

    @media print {
      html,
      body {
        overflow: visible;
        width: auto !important;
        height: auto !important;
        background: #ffffff !important;
      }

      .app-logo,
      .toolbar,
      .status,
      .djs-palette,
      .djs-context-pad,
      .djs-popup,
      .djs-search-container,
      .bjs-powered-by {
        display: none !important;
        visibility: hidden !important;
      }

      .app-shell,
      .canvas-shell,
      #canvas,
      .djs-container,
      .djs-container > .viewport,
      .djs-container > svg {
        position: static !important;
        inset: auto !important;
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        max-width: none !important;
        max-height: none !important;
        overflow: visible !important;
        background: #ffffff !important;
        box-shadow: none !important;
      }
    }

    @media (max-width: 720px) {
      .app-logo {
        top: 12px;
        right: 12px;
        width: 72px;
      }

      .toolbar {
        left: 12px;
        right: 12px;
        bottom: 12px;
        max-width: none;
      }

      .status {
        left: 12px;
        bottom: 120px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <img class="app-logo" src="./assets/setl_logo.svg" alt="Setl logo" />

    <main class="canvas-shell">
      <div id="canvas"></div>
    </main>

    <div class="toolbar">
      <button id="open-button" class="toolbar-button secondary" type="button">Загрузить BPMN</button>
      <button id="save-button" class="toolbar-button" type="button">Скачать BPMN</button>
      <label class="toolbar-setting" for="font-size-input">
        <span>Шрифт</span>
        <input id="font-size-input" type="number" min="8" max="48" step="1" value="12" />
      </label>
      <input id="file-input" type="file" accept=".bpmn,.xml,text/xml,application/xml" hidden />
      <div id="file-name" class="toolbar-status">diagram.bpmn</div>
    </div>

    <div id="status" class="status" aria-live="polite"></div>
  </div>

  <script src="./dist/bpmn-modeler.development.js"></script>
  <script>
    const initialDiagram = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn2:definitions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:bpmn2="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xsi:schemaLocation="http://www.omg.org/spec/BPMN/20100524/MODEL BPMN20.xsd" id="simple" exporter="camunda modeler" exporterVersion="2.6.0" targetNamespace="http://bpmn.io/schema/bpmn">
  <bpmn2:process id="Process_1" isExecutable="false">
    <bpmn2:subProcess id="SubProcess_1" name="Sub Process 1">
      <bpmn2:incoming>SequenceFlow_3</bpmn2:incoming>
      <bpmn2:outgoing>SequenceFlow_2</bpmn2:outgoing>
      <bpmn2:startEvent id="StartEvent_1" name="Start Event 1">
        <bpmn2:outgoing>SequenceFlow_1</bpmn2:outgoing>
      </bpmn2:startEvent>
      <bpmn2:task id="Task_1" name="Task">
        <bpmn2:incoming>SequenceFlow_1</bpmn2:incoming>
      </bpmn2:task>
      <bpmn2:sequenceFlow id="SequenceFlow_1" name="" sourceRef="StartEvent_1" targetRef="Task_1"/>
    </bpmn2:subProcess>
    <bpmn2:endEvent id="EndEvent_1" name="End Event">
      <bpmn2:incoming>SequenceFlow_2</bpmn2:incoming>
    </bpmn2:endEvent>
    <bpmn2:sequenceFlow id="SequenceFlow_2" name="" sourceRef="SubProcess_1" targetRef="EndEvent_1"/>
    <bpmn2:startEvent id="StartEvent_2" name="Start">
      <bpmn2:outgoing>SequenceFlow_3</bpmn2:outgoing>
    </bpmn2:startEvent>
    <bpmn2:sequenceFlow id="SequenceFlow_3" name="Flow" sourceRef="StartEvent_2" targetRef="SubProcess_1"/>
  </bpmn2:process>
  <bpmndi:BPMNDiagram id="BPMNDiagram_1">
    <bpmndi:BPMNPlane id="BPMNPlane_1" bpmnElement="Process_1">
      <bpmndi:BPMNShape id="_BPMNShape_SubProcess_2" bpmnElement="SubProcess_1" isExpanded="true">
        <dc:Bounds height="300.0" width="300.0" x="300.0" y="80.0"/>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="_BPMNShape_StartEvent_2" bpmnElement="StartEvent_1">
        <dc:Bounds height="36.0" width="36.0" x="352.0" y="242.0"/>
        <bpmndi:BPMNLabel>
          <dc:Bounds x="345" y="285" width="55" height="14" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="_BPMNShape_Task_2" bpmnElement="Task_1">
        <dc:Bounds height="80.0" width="100.0" x="420.0" y="220.0"/>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNEdge id="BPMNEdge_SequenceFlow_1" bpmnElement="SequenceFlow_1" sourceElement="_BPMNShape_StartEvent_2" targetElement="_BPMNShape_Task_2">
        <di:waypoint xsi:type="dc:Point" x="388.0" y="260.0"/>
        <di:waypoint xsi:type="dc:Point" x="420.0" y="260.0"/>
      </bpmndi:BPMNEdge>
      <bpmndi:BPMNShape id="_BPMNShape_EndEvent_2" bpmnElement="EndEvent_1">
        <dc:Bounds height="36.0" width="36.0" x="650.0" y="212.0"/>
        <bpmndi:BPMNLabel>
          <dc:Bounds x="645" y="255" width="51" height="14" />
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNEdge id="BPMNEdge_SequenceFlow_2" bpmnElement="SequenceFlow_2" sourceElement="_BPMNShape_SubProcess_2" targetElement="_BPMNShape_EndEvent_2">
        <di:waypoint xsi:type="dc:Point" x="600.0" y="230.0"/>
        <di:waypoint xsi:type="dc:Point" x="650.0" y="230.0"/>
      </bpmndi:BPMNEdge>
      <bpmndi:BPMNShape id="_BPMNShape_StartEvent_11" bpmnElement="StartEvent_2">
        <dc:Bounds height="36.0" width="36.0" x="108.0" y="212.0"/>
        <bpmndi:BPMNLabel>
          <dc:Bounds height="0.0" width="0.0" x="126.0" y="253.0"/>
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNEdge id="BPMNEdge_SequenceFlow_3" bpmnElement="SequenceFlow_3" sourceElement="_BPMNShape_StartEvent_11" targetElement="_BPMNShape_SubProcess_2">
        <di:waypoint xsi:type="dc:Point" x="144.0" y="230.0"/>
        <di:waypoint xsi:type="dc:Point" x="300.0" y="230.0"/>
        <bpmndi:BPMNLabel>
          <dc:Bounds height="21.0" width="33.0" x="192.0" y="204.0"/>
        </bpmndi:BPMNLabel>
      </bpmndi:BPMNEdge>
    </bpmndi:BPMNPlane>
  </bpmndi:BPMNDiagram>
</bpmn2:definitions>`;

    const canvas = document.getElementById('canvas');
    const openButton = document.getElementById('open-button');
    const saveButton = document.getElementById('save-button');
    const fontSizeInput = document.getElementById('font-size-input');
    const fileInput = document.getElementById('file-input');
    const fileNameNode = document.getElementById('file-name');
    const statusNode = document.getElementById('status');
    const fontSizeStorageKey = 'setl-bpmn-font-size';

    const modeler = new BpmnJS({
      container: canvas
    });

    let currentFileName = 'diagram.bpmn';
    let currentFontSize = readStoredFontSize();
    let statusTimer;

    function showStatus(message) {
      statusNode.textContent = message;
      statusNode.classList.add('is-visible');

      window.clearTimeout(statusTimer);
      statusTimer = window.setTimeout(() => {
        statusNode.classList.remove('is-visible');
      }, 2200);
    }

    async function openDiagram() {
      try {
        applyFontSize(currentFontSize);
        await modeler.importXML(initialDiagram);
        const canvasApi = modeler.get('canvas');
        canvasApi.zoom('fit-viewport');
        fileNameNode.textContent = currentFileName;
        showStatus('Редактор готов к работе');
      } catch (error) {
        console.error('Failed to load BPMN diagram', error);
        showStatus('Не удалось загрузить стартовую диаграмму');
      }
    }

    function normalizeFontSize(value) {
      const numericValue = Number.parseInt(value, 10);

      if (Number.isNaN(numericValue)) {
        return 12;
      }

      return Math.max(8, Math.min(48, numericValue));
    }

    function readStoredFontSize() {
      try {
        return normalizeFontSize(window.localStorage.getItem(fontSizeStorageKey));
      } catch {
        return 12;
      }
    }

    function persistFontSize(fontSize) {
      try {
        window.localStorage.setItem(fontSizeStorageKey, String(fontSize));
      } catch {
        // Ignore storage errors and keep the setting for the current session.
      }
    }

    function applyFontSize(value) {
      currentFontSize = normalizeFontSize(value);
      fontSizeInput.value = String(currentFontSize);
      modeler.setFontSize(currentFontSize);
      persistFontSize(currentFontSize);
    }

    function downloadFile(fileName, content, type) {
      const blob = new Blob([ content ], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();

      window.setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 0);
    }

    openButton.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = async (loadEvent) => {
        try {
          const xml = loadEvent.target.result;
          applyFontSize(currentFontSize);
          await modeler.importXML(xml);
          modeler.get('canvas').zoom('fit-viewport');
          currentFileName = file.name || 'diagram.bpmn';
          fileNameNode.textContent = currentFileName;
          showStatus('Диаграмма загружена');
        } catch (error) {
          console.error('Failed to import BPMN diagram', error);
          showStatus('Ошибка загрузки BPMN');
        }
      };

      reader.readAsText(file);
      fileInput.value = '';
    });

    fontSizeInput.addEventListener('change', () => {
      applyFontSize(fontSizeInput.value);
      showStatus(`Размер шрифта: ${currentFontSize}px`);
    });

    fontSizeInput.addEventListener('blur', () => {
      fontSizeInput.value = String(currentFontSize);
    });

    saveButton.addEventListener('click', async () => {
      try {
        const result = await modeler.saveXML({ format: true });
        downloadFile(currentFileName, result.xml, 'application/xml;charset=utf-8');
        fileNameNode.textContent = currentFileName;
        showStatus('BPMN выгружен');
      } catch (error) {
        console.error('Failed to export BPMN diagram', error);
        showStatus('Ошибка выгрузки BPMN');
      }
    });

    applyFontSize(currentFontSize);
    openDiagram();

    window.addEventListener('resize', () => {
      const canvasApi = modeler.get('canvas');
      canvasApi.resized();
      canvasApi.zoom('fit-viewport');
    });
  </script>
</body>
</html>
